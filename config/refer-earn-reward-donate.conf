<VirtualHost *:80>
    ServerName refer-earn-reward-donate.local
    DocumentRoot /home/YOUR_UBUNTU_USER/Desktop/refer-earn-reward-donate

    <Directory /home/YOUR_UBUNTU_USER/Desktop/refer-earn-reward-donate>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch "^(?:\.env|composer\.(?:json|lock)|.*\.sql)$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "/(?:database|vendor)(?:/|$)">
        Require all denied
    </DirectoryMatch>

    <LocationMatch "^/uploads/(?:business_documents|referrer_documents)/">
        Require all denied
    </LocationMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    ErrorLog ${APACHE_LOG_DIR}/refer-earn-reward-donate-error.log
    CustomLog ${APACHE_LOG_DIR}/refer-earn-reward-donate-access.log combined

    SetEnv DB_HOST 127.0.0.1
    SetEnv DB_NAME referral_platform
    SetEnv DB_USER root
    SetEnv DB_PASSWORD CHANGE_THIS_TO_YOUR_MYSQL_ROOT_PASSWORD
    SetEnv DB_CHARSET utf8mb4
    SetEnv APP_BASE_URL /
</VirtualHost>
